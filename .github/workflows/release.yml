name: Release Windows & macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Go tests
        env:
          CGO_ENABLED: '0'
        run: go test -short ./internal/...

      - name: Cache NSIS for Windows installer
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\mygo\nsis-*
          key: nsis-${{ hashFiles('go.sum') }}

      - name: Prepare Windows Authenticode certificate (optional)
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP 'code-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $cfg = Get-Content mygo.json -Raw | ConvertFrom-Json
            if ($cfg.PSObject.Properties['windows'] -and $cfg.windows) {
              $cfg.windows | Add-Member -NotePropertyName certificate -NotePropertyValue $pfx -Force
            } else {
              $cfg | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{ certificate = $pfx }) -Force
            }
            [IO.File]::WriteAllText((Resolve-Path mygo.json), ($cfg | ConvertTo-Json -Depth 10), (New-Object Text.UTF8Encoding($false)))
          }

      - name: Build Windows installer & binary
        env:
          CGO_ENABLED: '0'
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          go tool mygo build -platform windows/amd64
          $ver = (Get-Content mygo.json | ConvertFrom-Json).version
          mkdir dist-win | Out-Null
          Copy-Item "build\windows-amd64\sonora-setup-$ver-amd64.exe" dist-win\
          Copy-Item "build\windows-amd64\install.ps1" dist-win\
          foreach ($pattern in @("update-windows-*.json", "sonora-*-windows-*.tar.gz", "*.delta")) {
            Get-ChildItem "build\windows-amd64\$pattern" -ErrorAction SilentlyContinue | Copy-Item -Destination dist-win\
          }
          New-Item -ItemType Directory -Force -Path dist-win\pkg | Out-Null
          Copy-Item "build\windows-amd64\Sonora.exe" dist-win\pkg\
          Copy-Item "build\windows-amd64\LICENSE" dist-win\pkg\
          Copy-Item -Recurse "build\windows-amd64\licenses" dist-win\pkg\
          Compress-Archive -Path dist-win\pkg\* -DestinationPath "dist-win\Sonora-$ver-windows-amd64.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force dist-win\pkg

      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist-win/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run Go tests
        env:
          CGO_ENABLED: '0'
        run: go test -short ./internal/...

      - name: Build macOS Universal (.app & .dmg)
        env:
          CGO_ENABLED: '0'
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go tool mygo build -platform darwin/universal
          mkdir -p dist-mac
          cp build/darwin-universal/*.dmg dist-mac/ 2>/dev/null || cp build/*.dmg dist-mac/
          for f in build/darwin-universal/update-darwin-*.json build/darwin-universal/sonora-*-darwin-*.tar.gz build/darwin-universal/*.delta; do
            [ -e "$f" ] && cp "$f" dist-mac/
          done
          if [ -e dist-mac/update-darwin-universal.json ]; then
            [ -e dist-mac/update-darwin-arm64.json ] || cp dist-mac/update-darwin-universal.json dist-mac/update-darwin-arm64.json
            [ -e dist-mac/update-darwin-amd64.json ] || cp dist-mac/update-darwin-universal.json dist-mac/update-darwin-amd64.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist-mac/*

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS and upload to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VER="${TAG#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="## $VER" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          cd artifacts
          sha256sum * > SHA256SUMS
          if [ -s "$NOTES_FILE" ]; then
            if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
              gh release upload "$TAG" * -R "$REPO" --clobber
              gh release edit "$TAG" -R "$REPO" --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" * -R "$REPO" --title "Sonora $TAG" --notes-file "$NOTES_FILE"
            fi
          else
            if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
              gh release upload "$TAG" * -R "$REPO" --clobber
            else
              gh release create "$TAG" * -R "$REPO" --title "Sonora $TAG" --generate-notes
            fi
          fi
